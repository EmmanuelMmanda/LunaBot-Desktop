name: Report a LunaBot issue
description: Share a reproducible product problem without posting private account data.
body:
  - type: input
    id: version
    attributes:
      label: LunaBot version
      placeholder: e.g. 0.2.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps and expected result
      description: Use synthetic or redacted examples. Do not include broker credentials, licence tokens or account identifiers.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked that my report contains no passwords, activation tokens, personal account data or unredacted logs.
          required: true

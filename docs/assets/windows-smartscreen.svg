<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Windows SmartScreen steps for opening the LunaBot installer</title>
  <desc id="desc">Choose More info, check the app name and publisher, then choose Run anyway only when the file matches the official LunaBot release.</desc>
  <rect width="1440" height="760" fill="#eef1f2"/>
  <text x="72" y="72" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="600" fill="#17202a">Windows may ask before opening LunaBot</text>
  <text x="72" y="108" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#53606c">The wording can vary by Windows version. Review the file before continuing.</text>
  <g transform="translate(72 154)">
    <rect width="612" height="500" rx="8" fill="#0878d1"/>
    <circle cx="58" cy="65" r="22" fill="none" stroke="#fff" stroke-width="4"/><path d="M58 51v18m0 12v2" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <text x="98" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#fff">Windows protected your PC</text>
    <text x="42" y="135" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#fff">Microsoft Defender SmartScreen prevented an</text>
    <text x="42" y="163" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#fff">unrecognized app from starting.</text>
    <rect x="42" y="213" width="118" height="42" rx="3" fill="#fff" fill-opacity=".13" stroke="#fff"/><text x="68" y="240" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#fff">More info</text>
    <text x="42" y="316" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#dff2ff">1. Choose More info</text>
    <text x="42" y="347" font-family="Segoe UI, Arial, sans-serif" font-size="14" fill="#dff2ff">Do not turn SmartScreen off.</text>
    <rect x="436" y="424" width="134" height="42" rx="3" fill="#fff" fill-opacity=".1" stroke="#fff"/><text x="473" y="451" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#fff">Don't run</text>
  </g>
  <g transform="translate(756 154)">
    <rect width="612" height="500" rx="8" fill="#0878d1"/>
    <text x="42" y="70" font-family="Segoe UI, Arial, sans-serif" font-size="28" fill="#fff">Check, then continue</text>
    <text x="42" y="130" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#dff2ff">App</text><text x="42" y="159" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#fff">LunaBot_[version]_x64-setup.exe</text>
    <text x="42" y="208" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#dff2ff">Publisher</text><text x="42" y="237" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="600" fill="#fff">Unknown publisher or local certificate</text>
    <text x="42" y="294" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#dff2ff">2. Match the file name and SHA-256 to the official release.</text>
    <text x="42" y="325" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#dff2ff">3. If they match, choose Run anyway.</text>
    <rect x="42" y="407" width="146" height="48" rx="3" fill="#fff"/><text x="67" y="437" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="600" fill="#075d9d">Run anyway</text>
    <rect x="202" y="407" width="134" height="48" rx="3" fill="#fff" fill-opacity=".1" stroke="#fff"/><text x="239" y="437" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#fff">Don't run</text>
  </g>
</svg>
